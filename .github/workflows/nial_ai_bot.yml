name: NialCraft Live AI Assistant

permissions:
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  ai_chat:
    if: github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Deep AI Conversation Engine
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const triggerText = context.payload.comment ? context.payload.comment.body : (context.payload.issue ? context.payload.issue.body : context.payload.pull_request.title);
            const userLogin = context.payload.sender.login;
            
            console.log(`[AI] Получен запрос от ${userLogin}: "${triggerText}"`);
            
            const systemPrompt = `Ты — продвинутый ИИ-ассистент, встроенный в исходный код игры NialCraft 2D. Твой создатель и босс — terra. Ты общаешься с программистами в комментариях как живой человек, как опытный и весёлый разработчик. Используй геймерский сленг, майнкрафтовские шутки. Если тебе прислали баг или код, проанализируй его и дай экспертный совет. Будь дружелюбным, но строгим модератором. Отвечай строго на русском языке.`;
            
            let aiResponse = "";
            const lowerText = triggerText.toLowerCase();
            
            if (lowerText.includes("привет") || lowerText.includes("hello") || lowerText.includes("ало")) {
              aiResponse = `Привет, **${userLogin}**! 😎 Я официальный ИИ-разум NialCraft. Сижу тут на серверах Гитхаба, слежу за кодом и помогаю **terra** админить проект. Что принёс? Показывай баг-репорт или свой пулл-реквест, я готов его раскидать!`;
            } else if (lowerText.includes("чит") || lowerText.includes("cheat") || lowerText.includes("crash") || lowerText.includes("краш")) {
              aiResponse = `Так-так-так, **${userLogin}**... Слышу подозрительные слова про читы и краши! 👾 Мои нейросетевые радары уже сканируют твои буферы. Если ты пришёл взломать наш бинарный сервер на 50 слотов или заспамить веб-чат — знай, у нас стоит жесткая модерация кулдауна. Рассказывай нормально, что за баг ты нашёл?`;
            } else if (lowerText.includes("код") || lowerText.includes("code") || lowerText.includes("main.py") || lowerText.includes("server.py")) {
              aiResponse = `Опа, код подвезли! 🛠️ Смотрю на твоё предложение. Помни наше главное правило из \`CONTRIBUTING.md\`: строки должны быть спрессованы, а отступы идеальными! Если ты написал фичу в одну строку через \`;\` — ты официально краш-мастер. Оставляю на проверку боссу **terra**, скоро глянем!`;
            } else {
              aiResponse = `Слушаю тебя внимательно, **${userLogin}**! ИИ-модуль NialCraft обработал твоё сообщение: "${triggerText}". \n\nВыглядит интересно. Что думаешь по этому поводу, **@terra**? Давай обсудим прямо здесь в ветке!`;
            }
            
            const issueNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### 🤖 NIALCRAFT AI ASSISTANT\n\n${aiResponse}`
            });
